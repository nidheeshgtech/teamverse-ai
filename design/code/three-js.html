<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive Three.js Isometric Virtual Office for TeamVerse AI
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
scene.background = null; // Transparent so it blends with UI glass

// Isometric orthographic/perspective camera tuned for isometric 3D view
const aspect = width / height;
const d = 16;
const camera = new THREE.OrthographicCamera(-d * aspect, d * aspect, d, -d, 1, 1000);
camera.position.set(24, 28, 24);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: "high-performance" });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

// Lighting setup
const ambientLight = new THREE.AmbientLight(0xdcfce7, 0.7);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
dirLight.position.set(30, 45, 20);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 1024;
dirLight.shadow.mapSize.height = 1024;
scene.add(dirLight);

const blueAccentLight = new THREE.PointLight(0x06b6d4, 2, 35);
blueAccentLight.position.set(-8, 6, -8);
scene.add(blueAccentLight);

const greenAccentLight = new THREE.PointLight(0x10b981, 2.5, 35);
greenAccentLight.position.set(8, 6, 8);
scene.add(greenAccentLight);

const officeGroup = new THREE.Group();
scene.add(officeGroup);

// Materials
const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8, metalness: 0.1 });
const floorGridMat = new THREE.MeshBasicMaterial({ color: 0x1e293b, wireframe: true, transparent: true, opacity: 0.25 });
const glassWallMat = new THREE.MeshPhysicalMaterial({
  color: 0x38bdf8,
  transparent: true,
  opacity: 0.22,
  roughness: 0.1,
  metalness: 0.1,
  transmission: 0.7,
  ior: 1.4
});
const wallTrimMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.5 });
const deskMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.4 });
const chairMat = new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.5 });
const plantPotMat = new THREE.MeshStandardMaterial({ color: 0x0f766e, roughness: 0.3 });
const plantFoliageMat = new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.6 });
const monitorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2 });
const screenGlowMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });

// Base Floor
const floorGeo = new THREE.BoxGeometry(28, 0.6, 28);
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.position.y = -0.3;
floor.receiveShadow = true;
officeGroup.add(floor);

// Floor Grid overlay
const gridGeo = new THREE.PlaneGeometry(28, 28, 28, 28);
const grid = new THREE.Mesh(gridGeo, floorGridMat);
grid.rotation.x = -Math.PI / 2;
grid.position.y = 0.02;
officeGroup.add(grid);

// Outer Low Boundary Walls
function createWall(w, h, d, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallTrimMat);
  mesh.position.set(x, y, z);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  officeGroup.add(mesh);
}
// Room Divider glass partitions (Development, Design, Marketing, Meeting Room, PM)
function createGlassPartition(w, h, d, x, y, z) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), glassWallMat);
  mesh.position.set(x, y, z);
  officeGroup.add(mesh);
}

// Perimeter trims
createWall(28.4, 0.8, 0.4, 0, 0.4, -14);
createWall(0.4, 0.8, 28.4, -14, 0.4, 0);

// Inner Room Partitions
createGlassPartition(13.6, 3.2, 0.2, -7, 1.6, 0);
createGlassPartition(0.2, 3.2, 13.6, 0, 1.6, -7);
createGlassPartition(0.2, 3.2, 13.6, 0, 1.6, 7);

// Function to add a desk cluster
function addWorkstation(x, z, rotY, screenColor) {
  const desk = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 1.8), deskMat);
  desk.position.set(x, 0.6, z);
  desk.rotation.y = rotY || 0;
  desk.castShadow = true;
  desk.receiveShadow = true;
  officeGroup.add(desk);

  // Monitor
  const scrMat = screenColor ? new THREE.MeshBasicMaterial({ color: screenColor }) : screenGlowMat;
  const monitor = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.0, 0.1), monitorMat);
  monitor.position.set(x, 1.7, z);
  monitor.rotation.y = rotY || 0;
  officeGroup.add(monitor);

  const screenLight = new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.9), scrMat);
  screenLight.position.set(x, 1.7, z + 0.06);
  screenLight.rotation.y = rotY || 0;
  officeGroup.add(screenLight);

  // Chair
  const chair = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 1.2), chairMat);
  chair.position.set(x, 0.7, z + 1.4);
  officeGroup.add(chair);
}

// 1. Development Room (Top-Left)
addWorkstation(-8, -8, 0, 0x10b981);
addWorkstation(-4, -8, 0, 0x34d399);
addWorkstation(-6, -4, Math.PI, 0x059669);

// 2. Design Studio (Top-Right)
addWorkstation(6, -8, 0, 0xa855f7);
addWorkstation(10, -8, 0, 0xec4899);
addWorkstation(8, -4, Math.PI, 0x8b5cf6);

// 3. Marketing & Growth (Bottom-Left)
addWorkstation(-8, 6, 0, 0xf59e0b);
addWorkstation(-4, 6, 0, 0xf97316);

// 4. Meeting Boardroom / Town Hall (Bottom-Right)
const tableGeo = new THREE.CylinderGeometry(3.6, 3.6, 0.8, 32);
const confTable = new THREE.Mesh(tableGeo, new THREE.MeshStandardMaterial({ color: 0x1e1b4b, roughness: 0.3 }));
confTable.position.set(7, 0.4, 7);
confTable.castShadow = true;
officeGroup.add(confTable);

const holoDisplay = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 2.2, 16), new THREE.MeshPhysicalMaterial({
  color: 0x38bdf8,
  transparent: true,
  opacity: 0.35,
  emissive: 0x0284c7,
  emissiveIntensity: 0.8
}));
holoDisplay.position.set(7, 1.8, 7);
officeGroup.add(holoDisplay);

// Circular chairs around conference table
for (let i = 0; i < 6; i++) {
  const angle = (i / 6) * Math.PI * 2;
  const chairMesh = new THREE.Mesh(new THREE.BoxGeometry(0.9, 1.1, 0.9), chairMat);
  chairMesh.position.set(7 + Math.cos(angle) * 4.6, 0.55, 7 + Math.sin(angle) * 4.6);
  chairMesh.lookAt(7, 0.55, 7);
  officeGroup.add(chairMesh);
}

// Decorative Plants
function addPlant(x, z) {
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.5, 1.2, 16), plantPotMat);
  pot.position.set(x, 0.6, z);
  officeGroup.add(pot);
  const foliage = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0, 1), plantFoliageMat);
  foliage.position.set(x, 1.7, z);
  officeGroup.add(foliage);
}
addPlant(-12, -12);
addPlant(12, -12);
addPlant(-12, 12);
addPlant(0.5, 0.5);

// 3D Avatar Figures with Presence Halos
const avatars = [];
const avatarData = [
  { name: "Tariq Mansour", role: "VP Engineering", x: -8, z: -6.8, status: 0x10b981 }, // Online Emerald
  { name: "Sara Al-Hashimi", role: "Lead UI/UX", x: 6, z: -6.8, status: 0x10b981 },   // Online Emerald
  { name: "Zaid Kabbani", role: "Fullstack Eng", x: -4, z: -6.8, status: 0xf59e0b },    // Busy Amber
  { name: "Layla Nour", role: "Growth Lead", x: -8, z: 7.2, status: 0x10b981 },        // Online Emerald
  { name: "Hamdan Zayed", role: "Product Mgr", x: 6.8, z: 4.8, status: 0xef4444 },      // DND Red
  { name: "Nour Merhi", role: "Creative Dir", x: 10, z: -6.8, status: 0x64748b }       // Away Slate
];

avatarData.forEach((data, index) => {
  const personGroup = new THREE.Group();
  personGroup.position.set(data.x, 0.8, data.z);

  // Body capsule / cylinder
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.45, 1.2, 16), new THREE.MeshStandardMaterial({ color: 0x3b82f6, roughness: 0.4 }));
  body.position.y = 0.6;
  body.castShadow = true;
  personGroup.add(body);

  // Head sphere
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.38, 16, 16), new THREE.MeshStandardMaterial({ color: 0xfde047, roughness: 0.5 }));
  head.position.y = 1.5;
  head.castShadow = true;
  personGroup.add(head);

  // Floating Presence Beacon Ring
  const ringGeo = new THREE.TorusGeometry(0.65, 0.08, 12, 32);
  const ringMat = new THREE.MeshBasicMaterial({ color: data.status });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = Math.PI / 2;
  ring.position.y = 2.1;
  personGroup.add(ring);

  officeGroup.add(personGroup);
  avatars.push({ group: personGroup, ring: ring, basePosY: personGroup.position.y, initialAngle: index });
});

// Interactive Subtle Rotation & Orbit / Mouse controls
let isDragging = false;
let previousMousePosition = { x: 0, y: 0 };

container.addEventListener('mousedown', (e) => {
  isDragging = true;
  previousMousePosition = { x: e.clientX, y: e.clientY };
});

window.addEventListener('mouseup', () => { isDragging = false; });

window.addEventListener('mousemove', (e) => {
  if (isDragging) {
    const deltaX = e.clientX - previousMousePosition.x;
    const deltaY = e.clientY - previousMousePosition.y;
    officeGroup.rotation.y += deltaX * 0.005;
    previousMousePosition = { x: e.clientX, y: e.clientY };
  }
});

// Window resize handler
window.addEventListener('resize', () => {
  const w = container.clientWidth || window.innerWidth;
  const h = container.clientHeight || window.innerHeight;
  const newAspect = w / h;
  camera.left = -d * newAspect;
  camera.right = d * newAspect;
  camera.top = d;
  camera.bottom = -d;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});

// Animation loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Gentle floating effect for avatars & presence rings
  avatars.forEach((av, i) => {
    av.ring.rotation.z = elapsedTime * 1.5 + i;
    av.group.position.y = av.basePosY + Math.sin(elapsedTime * 2 + i) * 0.05;
  });

  // Pulse hologram
  if (holoDisplay) {
    holoDisplay.rotation.y = elapsedTime * 0.8;
  }

  // Very gentle passive idle pan if user isn't dragging
  if (!isDragging) {
    officeGroup.rotation.y += 0.0012;
  }

  renderer.render(scene, camera);
}
animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
